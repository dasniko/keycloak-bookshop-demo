# HTTPS (default). Not applied in the "http" profile, see below.
%dev,prod.quarkus.http.ssl-port=8082
%dev,prod.quarkus.http.ssl.certificate.files=/certs/localhost.crt
%dev,prod.quarkus.http.ssl.certificate.key-files=/certs/localhost.key
%dev,prod.quarkus.http.insecure-requests=disabled
quarkus.tls.trust-all=true

quarkus.package.type=uber-jar

quarkus.oidc.auth-server-url=${AUTH_SERVER_URL:http://localhost:8080/realms/bookshop}
quarkus.oidc.token.audience=${PIM_AUDIENCE:pim}

# HTTP-only profile (QUARKUS_PROFILE=http)
%http.quarkus.http.port=8082
